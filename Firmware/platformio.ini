; PlatformIO project configuration for the Tube Furnace controller.
;
; Target: ESP-WROOM-32 module (generic dev board / DOIT ESP32 DevKit).
; The `esp32dev` board profile matches the WROOM-32 (4 MB flash, dual core).

[platformio]
default_envs = wroom32

[env:wroom32]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; Local libraries live in lib/ and are auto-discovered. Only external
; dependencies are listed here.
lib_deps =
    links2004/WebSockets @ ^2.4.1

build_flags =
    -Wall
    -Wextra
